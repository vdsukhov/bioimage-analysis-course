- uses: actions/checkout@v4

- name: Setup Pages
  uses: actions/configure-pages@v3

# 1) Python is required for notebook execution
- name: Set up Python
  uses: actions/setup-python@v5
  with:
    python-version: "3.11"
    cache: "pip"

# 2) Install your runtime deps (kernel, libraries used in notebooks)
- name: Install Python dependencies
  run: |
    python -m pip install --upgrade pip
    pip install -r requirements.txt

# 3) Install Jupyter Book (choose ONE method below)

# Option A: Install via pip (simple, consistent with Python execution)
- name: Install Jupyter Book
  run: pip install "jupyter-book>=2"

# Option B: If you want to keep npm install -g jupyter-book, you still need Python deps above.
# - name: Install Jupyter Book (via myst)
#   run: npm install -g jupyter-book

# 4) Execute + build HTML
- name: Build HTML (execute notebooks)
  run: jupyter book build --execute --html
  # Optional safety if your notebooks are heavy / conflict in parallel:
  # run: jupyter book build --execute --execute-parallel 1 --html

- name: Upload artifact
  uses: actions/upload-pages-artifact@v3
  with:
    path: "./_build/html"

- name: Deploy to GitHub Pages
  id: deployment
  uses: actions/deploy-pages@v4